name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# RecallCards runs as app #4 on the shared gateway box (37.27.31.223), beside
# 123resume, jsonsanitypro and spec-review. See my-simple-resume/SERVER-HANDOFF.md.
# The frontend's build context sits under the backend's compose (it builds the
# SPA and bakes in the Auth0 config), so the compose is driven from there. This
# deploy touches ONLY the recallcards-frontend container.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.31.223
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # Update the frontend source. git reset keeps untracked files, so
            # nothing here needs the .env (that lives in the backend dir below).
            cd /root/recallcards/flashcard-frontend
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master

            # The compose that builds the frontend lives in the backend dir, and
            # reads the Auth0 build args from the .env there.
            cd /root/recallcards/flashcard-backend
            docker network inspect recallcards-net >/dev/null 2>&1 || docker network create recallcards-net

            # Rebuild and restart ONLY the frontend. --no-deps leaves the backend
            # and MongoDB running. The shared gateway proxies to it with `resolve`,
            # so it re-resolves the new container IP on its own within seconds.
            docker compose -f docker-compose.prod.yml up -d --build --no-deps frontend

            # Health gate.
            sleep 6
            docker compose -f docker-compose.prod.yml ps frontend
            if [ "$(docker inspect -f '{{.State.Running}}' recallcards-frontend)" != "true" ]; then
              echo "::error::recallcards-frontend is not running after deploy"
              docker logs --tail 50 recallcards-frontend || true
              exit 1
            fi

            # End-to-end through the gateway: this exercises the SPA and its
            # /api proxy to the backend. Retry briefly while the gateway
            # re-resolves the new frontend IP.
            ok=0
            for i in $(seq 1 10); do
              code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 6 https://recallcards.net/ || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "::error::recallcards.net did not return 200 after deploy"
              docker logs --tail 40 recallcards-frontend || true
              exit 1
            fi

            docker image prune -f \
              --filter "label=com.docker.compose.project=flashcard-backend" \
              --filter "until=24h" || true

            echo "Frontend deploy OK"
